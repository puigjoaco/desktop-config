# Task-owned system-unit override. Remove this file to restore the official host.
[Service]
ExecStart=
ExecStart=/opt/sunshine-puig/bin/sunshine /home/joaquin/.config/sunshine/sunshine-virtual.conf
# A service crash can kill Sunshine and its guardian together. The synced
# snapshot survives and this runs as the same desktop user with the same bus.
ExecStopPost=/usr/bin/python3 /opt/sunshine-puig/share/sunshine/kwin-exclusive.py restore
TimeoutStopSec=60
